[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobinator"
version = "0.1.0"
description = "Local-first job application assistant"
requires-python = ">=3.10"
dependencies = [
  "anyio>=4.4,<4.9",
  "fastapi>=0.115,<0.116",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "reportlab>=4.2,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "types-reportlab>=4.2,<5",
]

[project.scripts]
jobinator-ingest = "jobinator.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["jobinator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
